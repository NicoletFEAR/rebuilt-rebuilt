plugins {
    id 'java'
    id 'application'
    id 'org.wpilib.GradleRIO' version '2027.0.0-alpha-8'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'io.freefair.lombok' version '9.5.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def runCommand(String... args) {
    try {
        return providers.exec {
            commandLine args
        }.standardOutput.asText.get().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

def projectGroup = provider { project.group }
def projectName = provider { project.name }
def projectVersion = provider { project.version.toString() }
def gitShaShort = provider { runCommand('git', 'rev-parse', '--short', 'HEAD') }
def gitSha = provider { runCommand('git', 'rev-parse', 'HEAD') }
def gitDate = provider {
    runCommand('git', 'log', '-1', '--format=%cd', '--date=iso')
}
def gitBranch = provider {
    runCommand('git', 'rev-parse', '--abbrev-ref', 'HEAD')
}
def buildDate = provider { java.time.Instant.now().toString() }
def buildUnixTime = provider {
    Long.toString(java.time.Instant.now().toEpochMilli())
}
def status = provider {
    Boolean.toString(!runCommand('git', 'status', '--porcelain').isEmpty())
}

def createVersionFile = tasks.register('createVersionFile') {
    dependsOn tasks.named('compDeploy')

    inputs.property('projectGroup', projectGroup)
    inputs.property('projectName', projectName)
    inputs.property('projectVersion', projectVersion)
    inputs.property('gitShaShort', gitShaShort)
    inputs.property('gitSha', gitSha)
    inputs.property('gitDate', gitDate)
    inputs.property('gitBranch', gitBranch)
    inputs.property('buildDate', buildDate)
    inputs.property('buildUnixTime', buildUnixTime)
    inputs.property('status', status)

    def outputDir = layout.buildDirectory.dir('generated/sources/version/java')
    outputs.dir(outputDir)

    doLast {
        def versionFile = outputDir.get().file('frc/robot/constants/BuildConstants.java').asFile
        versionFile.parentFile.mkdirs()
        versionFile.text = """\
            package frc.robot.constants;

            public final class BuildConstants {
                public static final String PROJECT_GROUP = "${projectGroup.get()}";
                public static final String PROJECT_NAME = "${projectName.get()}";
                public static final String PROJECT_VERSION = "${projectVersion.get()}";
                public static final String GIT_SHA_SHORT = "${gitShaShort.get()}";
                public static final String GIT_SHA = "${gitSha.get()}";
                public static final String GIT_DATE = "${gitDate.get()}";
                public static final String GIT_BRANCH = "${gitBranch.get()}";
                public static final String BUILD_DATE = "${buildDate.get()}";
                public static final long BUILD_UNIX_TIME = ${buildUnixTime.get()}L;
                public static final String STATUS = "${status.get()}";

                private BuildConstants() {}
            }
        """.stripIndent()
    }
}

sourceSets {
    main {
        java {
            srcDir(tasks.named('createVersionFile'))
        }
    }
}

def ROBOT_MAIN_CLASS = 'frc.robot.Main'

// Define my targets (SystemCore) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line.
            team = project.wpilib.getTeamOrDefault(4786)
            // Use the default systemcore host name. This must be called after setting team
            // as happens on the line above
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    // Set to true to use debug including JNI, which will drastically impact performance.
                    debugJni = false
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = true
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

task(replayWatch, type: JavaExec) {
    mainClass = 'org.littletonrobotics.junction.ReplayWatch'
    classpath = sourceSets.main.runtimeClasspath
}

// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + '/vendordeps/AdvantageKit.json').text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = System.getenv('REPLAY') == null
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def compDeploy = tasks.register('compDeploy') {
    def taskNamesProvider = project.provider {
        project.gradle.startParameter.taskNames
    }

    doLast {
        if (taskNamesProvider.get().any({
            it.toLowerCase().contains('deploy')
        })) {
            def branchPrefix = 'comp'
            def branch = 'git branch --show-current'.execute().text.trim()
            def formatter = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss z')
            formatter.setTimeZone(java.util.TimeZone.getTimeZone('America/Chicago'))
            def commitMessage = "Update at \'${formatter.format(new Date())}\'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }
            }
        }
    }
}

project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**'
        }
        googleJavaFormat()
        leadingSpacesToTabs(2)
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**'
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree('.') {
            include '**/*.json'
            exclude '**/build/**'
        }
        gson()
        leadingTabsToSpaces(4)
    }
    format 'misc', {
        target fileTree('.') {
            include '**/*.md', '**/*.gitignore'
            exclude '**/build/**'
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}
